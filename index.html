<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>尤克里里调音器</title>
<meta name="theme-color" content="#15302a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ukulele">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: one centred instrument panel per tab — tabs on top, gauge/diagrams in a white panel, a wooden headstock for the strings. */
:root{
  --bg:#eef3f0; --panel:#ffffff; --ink:#15302a; --muted:#5d746d; --line:#d3dfda; --soft:#e3ece8;
  --accent:#e0822a; --accent-ink:#ffffff; --wood:#c98b52; --wood-dark:#8a5428;
  --good:#1f9d64; --warn:#d8962a; --bad:#c94a3a; --needle:#15302a;
  --major:#e0822a; --minor:#4a6fa5; --seventh:#8a5bb0;
  --display:"Bricolage Grotesque","Noto Sans SC",system-ui,sans-serif;
  --body:"Noto Sans SC",system-ui,-apple-system,"PingFang SC",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1c19; --panel:#172925; --ink:#e7f1ec; --muted:#93aaa2; --line:#2a403a; --soft:#1f342f;
  --accent:#f09a47; --accent-ink:#1a0f05; --wood:#b07a46; --wood-dark:#6e431f;
  --good:#3cc888; --warn:#e6ab47; --bad:#e2685a; --needle:#e7f1ec;
  --major:#f09a47; --minor:#7f9fd6; --seventh:#b48ad6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1c19; --panel:#172925; --ink:#e7f1ec; --muted:#93aaa2; --line:#2a403a; --soft:#1f342f;
  --accent:#f09a47; --accent-ink:#1a0f05; --wood:#b07a46; --wood-dark:#6e431f;
  --good:#3cc888; --warn:#e6ab47; --bad:#e2685a; --needle:#e7f1ec;
  --major:#f09a47; --minor:#7f9fd6; --seventh:#b48ad6; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);padding:0 16px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:460px;margin:0 auto;padding-block:16px 32px;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.title-block{display:flex;flex-direction:column;gap:2px;min-width:0}
h1{font-family:var(--display);font-weight:700;font-size:1.5rem;margin:0;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:700;font-size:1.05rem;margin:0}
h3{font-family:var(--display);font-weight:700;font-size:1rem;margin:0}
.sub{color:var(--muted);font-size:.82rem}
.lang{display:flex;background:var(--soft);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;color:var(--muted);font:500 .8rem var(--body);padding:5px 11px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tab-panel{display:flex;flex-direction:column;gap:16px}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--soft);border-radius:12px;padding:4px;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tab{font:500 .86rem var(--body);border:0;background:transparent;color:var(--muted);padding:9px 2px;border-radius:9px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:500 .82rem var(--body);border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.small{padding:5px 10px;font-size:.78rem}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 16px 20px}
.gauge{width:100%;max-width:100%;display:block}
.gauge text{fill:var(--muted);font-family:var(--mono);font-size:11px}
.readout{display:flex;justify-content:center;align-items:baseline;gap:14px;margin-top:-6px}
.note{font-family:var(--display);font-weight:700;font-size:3.2rem;line-height:1;min-width:2.2ch;text-align:center}
.note sub{font-size:1.1rem;font-weight:500;color:var(--muted);vertical-align:baseline;margin-left:2px}
.meta{font-family:var(--mono);font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
.status{text-align:center;margin-top:10px;font-size:.9rem;font-weight:500;min-height:1.4em}
.status.good{color:var(--good)} .status.warn{color:var(--warn)} .status.bad{color:var(--bad)}

.head{position:relative;background:linear-gradient(180deg,var(--wood),var(--wood-dark));border-radius:22px 22px 10px 10px;padding:22px 18px 18px;display:grid;grid-template-columns:1fr 1fr;gap:14px 40px}
.head::before{content:"";position:absolute;top:14px;bottom:14px;left:50%;width:2px;transform:translateX(-50%);background:rgba(255,255,255,.18)}
.peg{position:relative;display:flex;align-items:center;gap:10px;background:var(--panel);color:var(--ink);border:2px solid transparent;border-radius:14px;padding:10px 12px;cursor:pointer;font:inherit;text-align:left;transition:transform .08s,border-color .15s;min-width:0}
.peg:active{transform:scale(.97)}
.peg.right{flex-direction:row-reverse;text-align:right}
.peg .dot{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--bg);font:700 1.05rem var(--display)}
.peg .lbl{display:flex;flex-direction:column;min-width:0}
.peg .lbl b{font:700 .95rem var(--display)}
.peg .lbl span{font:400 .72rem var(--mono);color:var(--muted)}
.peg.playing{border-color:var(--accent)}
.peg.playing .dot{background:var(--accent);color:var(--accent-ink)}
.peg.target{border-color:var(--good)}
.peg.target .dot{background:var(--good);color:#fff}

.controls{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1 1 140px;font:500 .92rem var(--body);border-radius:12px;padding:12px 14px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.note-box{font-size:.82rem;color:var(--muted);line-height:1.6;background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin:0}
.tips{font-size:.82rem;color:var(--muted);line-height:1.7;margin:0;padding-left:1.1em}

/* lesson */
.lesson{display:flex;flex-direction:column;gap:12px}
.lesson summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
.lesson summary::-webkit-details-marker{display:none}
.lesson summary::after{content:"＋";color:var(--muted);font-size:1.1rem}
.lesson[open] summary::after{content:"－"}
.lesson-body{display:flex;flex-direction:column;gap:14px;margin-top:12px}
.lesson p{margin:0;font-size:.9rem;line-height:1.7}
.kind{border-left:4px solid var(--c);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:6px}
.kind.major{--c:var(--major)} .kind.minor{--c:var(--minor)} .kind.seventh{--c:var(--seventh)}
.kind .tag{font:700 .95rem var(--display);color:var(--c)}
.kind .tag span{font-weight:500;color:var(--muted);font-family:var(--body);font-size:.8rem;margin-left:6px}
.formula{font:500 .85rem var(--mono);color:var(--ink);background:var(--soft);border-radius:8px;padding:6px 10px;display:inline-block}
.formula em{font-style:normal;color:var(--c);font-weight:700}
.listen{display:flex;flex-wrap:wrap;gap:8px}
.listen button{font:500 .82rem var(--body);border-radius:999px;padding:7px 12px;border:1px solid var(--c,var(--line));background:var(--panel);color:var(--ink);cursor:pointer}
.listen button:active{transform:scale(.97)}
.namekey{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.85rem;align-items:baseline}
.namekey b{font:700 1rem var(--display)}

/* chord diagrams */
.dg{display:block;width:100%;height:auto}
.dg .str{stroke:var(--muted);stroke-width:1.2}
.dg .fret{stroke:var(--line);stroke-width:1.2}
.dg .nut{stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.dg .fd{fill:var(--ink)}
.dg .fn{fill:var(--bg);font:700 10px var(--body);text-anchor:middle;dominant-baseline:central}
.dg .op{fill:none;stroke:var(--ink);stroke-width:1.5}
.dg .sl{fill:var(--muted);font:500 9px var(--mono);text-anchor:middle}
.chord-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:360px){.chord-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.chord-card{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:14px;padding:8px 6px 6px;cursor:pointer;color:var(--ink);font:inherit;transition:transform .08s,border-color .15s;min-width:0}
.chord-card.major{--c:var(--major)} .chord-card.minor{--c:var(--minor)} .chord-card.seventh{--c:var(--seventh)}
.chord-card:active{transform:scale(.97)}
.chord-card.on{border-color:var(--c)}
.chord-card b{font:700 1.05rem var(--display)}
.chord-card .dg{max-width:76px}
.chord-card .notes{font:400 .66rem var(--mono);color:var(--muted);white-space:nowrap}
.group-label{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:4px}
.group-label b{font:700 .95rem var(--display);color:var(--c)}
.group-label span{font-size:.78rem;color:var(--muted)}
.group-label.major{--c:var(--major)} .group-label.minor{--c:var(--minor)} .group-label.seventh{--c:var(--seventh)}

/* practice */
.stage{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;align-items:center}
.now,.next{display:flex;flex-direction:column;align-items:center;gap:4px}
.now .name{font:700 3rem/1 var(--display)}
.now .dg{max-width:150px}
.next{opacity:.6}
.next .cap{font-size:.75rem;color:var(--muted)}
.next .name{font:700 1.5rem/1 var(--display)}
.next .dg{max-width:84px}
.beats{display:flex;justify-content:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.beat{width:14px;height:14px;border-radius:50%;background:var(--soft);border:1px solid var(--line)}
.beat.on{background:var(--accent);border-color:var(--accent)}
.beat.on.first{background:var(--ink);border-color:var(--ink)}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.row label,.row .lab{font-size:.85rem;color:var(--muted);min-width:5.5em}
.row input[type=range]{flex:1;min-width:140px;accent-color:var(--accent)}
.num{font:500 .95rem var(--mono);font-variant-numeric:tabular-nums;min-width:4.5ch;text-align:right}
.stats{display:flex;justify-content:space-around;gap:8px;margin-top:12px;font-size:.8rem;color:var(--muted);text-align:center}
.stats b{display:block;font:500 1.2rem var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}

/* quiz */
.quiz-q{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.big-play{width:96px;height:96px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font:700 1rem var(--body);cursor:pointer;box-shadow:0 4px 14px rgba(224,130,42,.35)}
.big-play:active{transform:scale(.96)}
.answers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ans{font:700 1.15rem var(--display);padding:14px 4px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.ans.right{background:var(--good);border-color:var(--good);color:#fff}
.ans.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.feedback{min-height:1.5em;font-weight:500}
.feedback.good{color:var(--good)} .feedback.bad{color:var(--bad)}
.reveal{display:flex;justify-content:center}
.reveal .dg{max-width:90px}
@media (prefers-reduced-motion: reduce){#needle{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-block">
      <h1 data-t="appTitle">尤克里里练习</h1>
      <span class="sub" id="tuningName"></span>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="lang-zh" data-lang="zh">中文</button>
      <button type="button" id="lang-en" data-lang="en">EN</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-tune" data-tab="tune" type="button" data-t="tabTune">调音</button>
    <button class="tab" role="tab" id="tab-lib" data-tab="lib" type="button" data-t="tabLib">和弦</button>
    <button class="tab" role="tab" id="tab-prac" data-tab="prac" type="button" data-t="tabPrac">换和弦</button>
    <button class="tab" role="tab" id="tab-quiz" data-tab="quiz" type="button" data-t="tabQuiz">听辨</button>
  </nav>

  <!-- ============ Tune ============ -->
  <section class="tab-panel" id="panel-tune">
    <div class="chips" role="group" id="chips"></div>
    <section class="panel">
      <svg class="gauge" viewBox="0 0 300 165" aria-hidden="true">
        <path d="M 30 150 A 120 120 0 0 1 270 150" fill="none" stroke="var(--line)" stroke-width="10" stroke-linecap="round"/>
        <path id="zone" d="" fill="none" stroke="var(--good)" stroke-width="10" stroke-linecap="round" opacity=".55"/>
        <g id="ticks"></g>
        <g id="needle" style="transform-origin:150px 150px;transition:transform .12s ease-out">
          <line x1="150" y1="150" x2="150" y2="44" stroke="var(--needle)" stroke-width="3" stroke-linecap="round"/>
        </g>
        <circle cx="150" cy="150" r="7" fill="var(--accent)"/>
        <text x="30" y="164" text-anchor="middle">−50</text>
        <text x="150" y="20" text-anchor="middle">0</text>
        <text x="270" y="164" text-anchor="middle">+50</text>
      </svg>
      <div class="readout">
        <div class="note" id="note">–</div>
        <div class="meta"><span id="hz">— Hz</span><span id="cents">—</span></div>
      </div>
      <div class="status" id="status"></div>
    </section>
    <section class="head" id="head"></section>
    <div class="controls">
      <button class="btn primary" id="micBtn" type="button"></button>
      <button class="btn" id="loopBtn" type="button" aria-pressed="false" data-t="loop">循环播放</button>
    </div>
    <p class="note-box" id="micNote" hidden data-t="micFail"></p>
    <ul class="tips">
      <li data-t="tuneTip1"></li>
      <li data-t="tuneTip2"></li>
      <li data-t="tuneTip3"></li>
    </ul>
  </section>

  <!-- ============ Chords ============ -->
  <section class="tab-panel" id="panel-lib" hidden>
    <details class="panel lesson" id="lesson">
      <summary><h2 data-t="lessonTitle"></h2></summary>
      <div class="lesson-body">
        <p data-t="lessonIntro"></p>
        <p data-t="lessonRoot"></p>

        <div class="kind major">
          <div class="tag"><span class="k" data-t="majorName"></span><span data-t="majorFeel"></span></div>
          <p data-t="majorText"></p>
          <div><span class="formula">C = C · <em>E</em> · G</span></div>
          <div class="listen">
            <button type="button" data-play="C" data-t="playC"></button>
            <button type="button" data-play="F" data-t="playF"></button>
            <button type="button" data-play="G" data-t="playG"></button>
          </div>
        </div>

        <div class="kind minor">
          <div class="tag"><span class="k" data-t="minorName"></span><span data-t="minorFeel"></span></div>
          <p data-t="minorText"></p>
          <div><span class="formula">Cm = C · <em>E♭</em> · G</span></div>
          <div class="listen">
            <button type="button" data-seq="C,Cm" data-t="playCvsCm"></button>
            <button type="button" data-play="Am" data-t="playAm"></button>
            <button type="button" data-seq="A,Am" data-t="playAvsAm"></button>
          </div>
        </div>

        <div class="kind seventh">
          <div class="tag"><span class="k" data-t="seventhName"></span><span data-t="seventhFeel"></span></div>
          <p data-t="seventhText"></p>
          <div><span class="formula">G7 = G · B · D · <em>F</em></span></div>
          <div class="listen">
            <button type="button" data-seq="G,C" data-t="playGC"></button>
            <button type="button" data-seq="G7,C" data-t="playG7C"></button>
          </div>
        </div>

        <div>
          <h3 data-t="readName"></h3>
          <div class="namekey" style="margin-top:8px">
            <b>C</b><span data-t="keyC"></span>
            <b>Am</b><span data-t="keyAm"></span>
            <b>G7</b><span data-t="keyG7"></span>
            <b>B♭</b><span data-t="keyBb"></span>
            <b>F♯</b><span data-t="keySharp"></span>
          </div>
        </div>
      </div>
    </details>
    <p class="sub" style="margin:0" data-t="libHelp"></p>
    <div id="lib"></div>
  </section>

  <!-- ============ Practice ============ -->
  <section class="tab-panel" id="panel-prac" hidden>
    <div>
      <h2 data-t="pickProg"></h2>
      <div class="chips" id="presets" style="margin-top:8px"></div>
    </div>
    <div>
      <h2 data-t="pickOwn"></h2>
      <div class="chips" id="pracPick" style="margin-top:8px"></div>
    </div>
    <section class="panel">
      <div class="stage">
        <div class="now"><div class="name" id="nowName">C</div><div id="nowDg"></div></div>
        <div class="next"><span class="cap" data-t="next"></span><div class="name" id="nextName">Am</div><div id="nextDg"></div></div>
      </div>
      <div class="beats" id="beats"></div>
      <div class="stats">
        <div><b id="stChanges">0</b><span data-t="stChanges"></span></div>
        <div><b id="stTime">0:00</b><span data-t="stTime"></span></div>
        <div><b id="stBest">–</b><span data-t="stBest"></span></div>
      </div>
    </section>
    <div class="row"><label for="bpm" data-t="speed"></label><input type="range" id="bpm" min="40" max="160" step="2" value="70"><span class="num" id="bpmVal">70</span></div>
    <div class="row"><span class="lab" data-t="perChord"></span>
      <div class="chips" id="beatsPer">
        <button class="chip small" type="button" data-n="2"></button>
        <button class="chip small" type="button" data-n="4"></button>
        <button class="chip small" type="button" data-n="8"></button>
      </div>
    </div>
    <div class="row"><span class="lab" data-t="orderLab"></span>
      <div class="chips" id="orderPick">
        <button class="chip small" type="button" data-o="seq" data-t="orderSeq"></button>
        <button class="chip small" type="button" data-o="rand" data-t="orderRand"></button>
      </div>
    </div>
    <div class="controls">
      <button class="btn primary" id="pracBtn" type="button"></button>
      <button class="btn" id="strumBtn" type="button"></button>
    </div>
    <ul class="tips">
      <li data-t="pracTip1"></li>
      <li data-t="pracTip2"></li>
      <li data-t="pracTip3"></li>
    </ul>
  </section>

  <!-- ============ Quiz ============ -->
  <section class="tab-panel" id="panel-quiz" hidden>
    <div>
      <h2 data-t="level"></h2>
      <div class="chips" id="levels" style="margin-top:8px"></div>
    </div>
    <section class="panel">
      <div class="quiz-q">
        <button class="big-play" id="quizPlay" type="button" data-t="listenBtn"></button>
        <div class="feedback" id="quizFb"></div>
        <div class="reveal" id="quizReveal"></div>
      </div>
      <div class="stats">
        <div><b id="qScore">0/0</b><span data-t="qScore"></span></div>
        <div><b id="qStreak">0</b><span data-t="qStreak"></span></div>
        <div><b id="qBest">0</b><span data-t="qBest"></span></div>
      </div>
    </section>
    <div class="answers" id="answers"></div>
    <div class="controls">
      <button class="btn" id="quizArp" type="button" data-t="arp"></button>
      <button class="btn primary" id="quizNext" type="button" disabled data-t="nextQ"></button>
    </div>
    <ul class="tips">
      <li data-t="quizTip1"></li>
      <li data-t="quizTip2"></li>
    </ul>
  </section>
</div>

    orderLab:{zh:"顺序", en:"Order"}, orderSeq:{zh:"按顺序", en:"In order"}, orderRand:{zh:"随机", en:"Random"},
    start:{zh:"▶ 开始", en:"▶ Start"}, stop:{zh:"⏹ 停止", en:"⏹ Stop"},
    demoOn:{zh:"示范扫弦：开", en:"Demo strum: on"}, demoOff:{zh:"示范扫弦：关", en:"Demo strum: off"},
    preset_starter:{zh:"入门：C–Am", en:"Starter: C–Am"}, preset_blues:{zh:"布鲁斯 A7–D7–E7", en:"Blues A7–D7–E7"},

    pracTip3:{zh:"“最快速度”会记下你完整练满 1 分钟的最高 BPM。", en:"\"Best tempo\" records the highest BPM you played for a full minute."},

    level:{zh:"难度", en:"Level"},
    lvl_l1:{zh:"入门 · C F G Am", en:"Starter · C F G Am"}, lvl_l2:{zh:"大三 vs 小三", en:"Major vs minor"},
    lvl_l3:{zh:"加七和弦", en:"Add 7th chords"}, lvl_l4:{zh:"全部", en:"All chords"},
    listenBtn:{zh:"▶ 听", en:"▶ Listen"},
    quizIdle:{zh:"点橙色按钮听一个和弦，然后选出它", en:"Tap the orange button to hear a chord, then pick it"},
    quizAsk:{zh:"是哪个和弦？", en:"Which chord is it?"},
    quizRight:{zh:"答对了 ✓", en:"Correct ✓"},
    quizWrong:{zh:"是 {c}。点其他选项可以对比着听。", en:"It was {c}. Tap other answers to compare."},
    qScore:{zh:"答对", en:"Correct"}, qStreak:{zh:"连对", en:"Streak"}, qBest:{zh:"最佳连对", en:"Best streak"},
    arp:{zh:"一个音一个音地听", en:"Play note by note"}, nextQ:{zh:"下一题", en:"Next"},
    quizTip1:{zh:"大三和弦（Major，比如 C、F、G）听起来明亮；小三和弦（Minor，比如 Am、Dm、Em）偏暗、忧伤；七和弦（7th，比如 G7、C7）像话没说完。",
              en:"Major chords (C, F, G) sound bright; minor chords (Am, Dm, Em) sound darker; 7th chords (G7, C7) sound unfinished."},
    quizTip2:{zh:"答错后可以点其他选项对比着听。还分不清大小三和弦的话，先去“和弦”页的入门小课听几遍对比。",
              en:"After a wrong answer, tap other options to compare. If major and minor still sound alike, replay the comparisons in the Chords tab lesson."}
  };
  let lang = store.get("lang","zh"); if(lang!=="zh"&&lang!=="en") lang="zh";
  const t = (k, v) => { let s=(TX[k]&&TX[k][lang])||k; if(v) for(const x in v) s=s.split("{"+x+"}").join(v[x]); return s; };

  const NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
  const PC_LABEL = ["C","C♯","D","E♭","E","F","F♯","G","G♯","A","B♭","B"];
  const pretty = n => n.replace("#","♯");
  const noteMidi = n => { const m=n.match(/^([A-G]#?)(\d)$/); return NAMES.indexOf(m[1])+(parseInt(m[2])+1)*12; };
  const midiFreq = m => 440*Math.pow(2,(m-69)/12);
  const noteToFreq = n => midiFreq(noteMidi(n));
  const freqToMidi = f => 69+12*Math.log2(f/440);

  const TUNINGS = { std:["G4","C4","E4","A4"], lowg:["G3","C4","E4","A4"], d:["A4","D4","F#4","B4"], bari:["D3","G3","B3","E4"] };
  let current = store.get("tuning","std"); if(!TUNINGS[current]) current="std";

  // ---------- audio ----------
  let ctx=null; const cache={};
  function getCtx(){ if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)(); if(ctx.state==="suspended") ctx.resume(); return ctx; }
  function ksBuffer(freq){
    const key=freq.toFixed(2); if(cache[key]) return cache[key];
    const c=getCtx(), sr=c.sampleRate, len=Math.floor(sr*3.2);
    const buf=c.createBuffer(1,len,sr), d=buf.getChannelData(0);
    const N=Math.max(2,Math.round(sr/freq)), ring=new Float32Array(N);
    for(let i=0;i<N;i++) ring[i]=Math.random()*2-1;
    for(let k=0;k<2;k++) for(let i=1;i<N;i++) ring[i]=0.5*(ring[i]+ring[i-1]);
    let p=0;
    for(let i=0;i<len;i++){ const nx=(p+1)%N, v=ring[p]; d[i]=v; ring[p]=0.996*0.5*(v+ring[nx]); p=nx; }
    let peak=0; for(let i=0;i<len;i++) peak=Math.max(peak,Math.abs(d[i]));
    for(let i=0;i<len;i++) d[i]=d[i]/peak*0.8;
    return cache[key]=buf;
  }
  const voices=new Set();
  function playFreq(freq, when, gain){
    const c=getCtx(), src=c.createBufferSource(), g=c.createGain();
    src.buffer=ksBuffer(freq); g.gain.value=gain; src.connect(g).connect(c.destination);
    src.start(when||c.currentTime); voices.add(src); src.onended=()=>voices.delete(src);
  }
  function stopAll(){ voices.forEach(v=>{try{v.stop()}catch(e){}}); voices.clear(); }

  // ---------- tabs ----------
  let activeTab="tune";
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
  function showTab(name){
    if(activeTab==="tune" && name!=="tune" && micOn) stopMic();
    if(activeTab==="prac" && name!=="prac" && running) stopPractice();
    activeTab=name;
    document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===name));
    ["tune","lib","prac","quiz"].forEach(n=>$("panel-"+n).hidden = n!==name);
    store.set("tab",name); window.scrollTo(0,0);
  }

  // =====================================================================
  //  Tuner
  // =====================================================================
  const ticks=$("ticks");
  for(let c=-50;c<=50;c+=10){
    const a=(c/50)*60*Math.PI/180, r1=c===0?100:106, r2=114;
    const l=document.createElementNS("http://www.w3.org/2000/svg","line");
    l.setAttribute("x1",150+r1*Math.sin(a)); l.setAttribute("y1",150-r1*Math.cos(a));
    l.setAttribute("x2",150+r2*Math.sin(a)); l.setAttribute("y2",150-r2*Math.cos(a));
    l.setAttribute("stroke","var(--muted)"); l.setAttribute("stroke-width",c===0?2:1);
    ticks.appendChild(l);
  }
  (function(){ const a=5/50*60*Math.PI/180, r=120;
    $("zone").setAttribute("d",`M ${150-r*Math.sin(a)} ${150-r*Math.cos(a)} A ${r} ${r} 0 0 1 ${150+r*Math.sin(a)} ${150-r*Math.cos(a)}`); })();

  const strLabel = (i,n) => `${t("str",{n:4-i})} ${pretty(n)}`;
  function renderTuner(){
    const notes=TUNINGS[current];
    $("tuningName").textContent=t("tuning_"+current);
    const ch=$("chips"); ch.innerHTML="";
    Object.keys(TUNINGS).forEach(k=>{
      const b=document.createElement("button"); b.className="chip"; b.type="button"; b.textContent=t("chip_"+k);
      b.setAttribute("aria-pressed",k===current);
      b.onclick=()=>{ current=k; store.set("tuning",k); renderTuner(); renderLibrary(); };
      ch.appendChild(b);
    });
    const head=$("head"); head.innerHTML="";
    // 2+2 headstock seen from the front: strings 4 / 1 at the top, 3 / 2 nearer the nut
    [{i:0,s:"left"},{i:3,s:"right"},{i:1,s:"left"},{i:2,s:"right"}].forEach(({i,s})=>{
      const n=notes[i], f=noteToFreq(n), b=document.createElement("button");
      b.type="button"; b.className="peg"+(s==="right"?" right":""); b.dataset.idx=i; b.id="peg-"+i;
      b.innerHTML=`<span class="dot">${pretty(n.replace(/\d/,""))}</span><span class="lbl"><b>${t("str",{n:4-i})} · ${pretty(n)}</b><span>${f.toFixed(2)} Hz</span></span>`;
      b.onclick=()=>pluck(i);
      head.appendChild(b);
    });
    micBtn.textContent = micOn? t("micOff") : t("micOn");
  }

  let loopTimer=null, playingIdx=null, looping=false;
  $("loopBtn").onclick=()=>{ looping=!looping; $("loopBtn").setAttribute("aria-pressed",looping); if(!looping) clearTimeout(loopTimer); };
  function pluck(i){
    const n=TUNINGS[current][i], f=noteToFreq(n);
    stopAll(); playFreq(f,0,0.9);
    document.querySelectorAll(".peg").forEach(p=>p.classList.remove("playing"));
    const peg=$("peg-"+i); peg.classList.add("playing"); playingIdx=i;
    if(!micOn) showNote(n.replace(/\d/,""), n.match(/\d/)[0], f, 0, t("playing",{s:strLabel(i,n)}), "");
    clearTimeout(loopTimer);
    loopTimer=setTimeout(()=>{ peg.classList.remove("playing"); if(looping && playingIdx===i) pluck(i); }, looping?2200:3000);
  }
  const needle=$("needle");
  function setNeedle(c){ c=Math.max(-50,Math.min(50,c)); needle.style.transform=`rotate(${c/50*60}deg)`; }
  function setStatus(msg,cls){ const s=$("status"); s.textContent=msg; s.className="status "+(cls||""); }
  function showNote(name,oct,hz,cents,msg,cls){
    $("note").innerHTML=`${pretty(name)}<sub>${oct}</sub>`;
    $("hz").textContent=hz.toFixed(1)+" Hz";
    $("cents").textContent=(cents>0?"+":cents<0?"−":"±")+Math.abs(Math.round(cents))+" "+t("cents");
    setStatus(msg,cls); setNeedle(cents);
  }

  let micOn=false, stream=null, analyser=null, raf=null, smooth=null, lastSeen=0;
  const micBtn=$("micBtn"), micNote=$("micNote");
  micBtn.onclick=async()=>{
    if(micOn){ stopMic(); return; }
    micNote.hidden=true;
    try{
      if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw new Error("unsupported");
      stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    }catch(e){ micNote.hidden=false; return; }
    const c=getCtx(); const srcNode=c.createMediaStreamSource(stream);
    analyser=c.createAnalyser(); analyser.fftSize=4096; srcNode.connect(analyser);
    micOn=true; micBtn.textContent=t("micOff"); micBtn.classList.remove("primary");
    setStatus(t("pluckOne")); micLoop();
  };
  function stopMic(){
    micOn=false; cancelAnimationFrame(raf);
    if(stream) stream.getTracks().forEach(tr=>tr.stop());
    micBtn.textContent=t("micOn"); micBtn.classList.add("primary");
    document.querySelectorAll(".peg").forEach(p=>p.classList.remove("target"));
    setStatus(t("micStopped"));
  }
  const tbuf=new Float32Array(4096);
  function detect(b,sr){
    let rms=0; for(let i=0;i<b.length;i++) rms+=b[i]*b[i]; rms=Math.sqrt(rms/b.length);
    if(rms<0.008) return -1;
    let r1=0,r2=b.length-1; const th=0.2;
    for(let i=0;i<b.length/2;i++) if(Math.abs(b[i])<th){r1=i;break;}
    for(let i=1;i<b.length/2;i++) if(Math.abs(b[b.length-i])<th){r2=b.length-i;break;}
    const x=b.slice(r1,r2), n=x.length; if(n<256) return -1;
    const ac=new Float32Array(n);
    for(let lag=0;lag<n;lag++){ let s=0; for(let i=0;i<n-lag;i++) s+=x[i]*x[i+lag]; ac[lag]=s; }
    let d=0; while(d<n-1 && ac[d]>ac[d+1]) d++;
    let maxV=-1,maxP=-1; for(let i=d;i<n;i++) if(ac[i]>maxV){maxV=ac[i];maxP=i;}
    if(maxP<=0||maxP>=n-1) return -1;
    const a=ac[maxP-1],bb=ac[maxP],cc=ac[maxP+1], den=a+cc-2*bb;
    return sr/(maxP+(den?(a-cc)/(2*den):0));
  }
  function micLoop(){
    if(!micOn) return;
    analyser.getFloatTimeDomainData(tbuf);
    const f=detect(tbuf,ctx.sampleRate), now=performance.now();
    if(f>60 && f<1200){
      smooth = smooth? smooth*0.7+f*0.3 : f; lastSeen=now;
      const notes=TUNINGS[current];
      let best=0,bd=1e9;
      notes.forEach((n,i)=>{ const dd=Math.abs(freqToMidi(smooth)-noteMidi(n)); if(dd<bd){bd=dd;best=i;} });
      const target=notes[best], cents=1200*Math.log2(smooth/noteToFreq(target));
      document.querySelectorAll(".peg").forEach(p=>p.classList.toggle("target",+p.dataset.idx===best));
      const s=strLabel(best,target), c=Math.abs(Math.round(cents)); let msg,cls;
      if(Math.abs(cents)>150){ msg=t("far",{s}); cls="bad"; }
      else if(Math.abs(cents)<=5){ msg=t("inTune",{s}); cls="good"; }
      else if(cents<0){ msg=t("low",{s,c}); cls="warn"; }
      else { msg=t("high",{s,c}); cls="warn"; }
      const m=Math.round(freqToMidi(smooth));
      showNote(NAMES[(m%12+12)%12], Math.floor(m/12)-1, smooth, Math.abs(cents)>150?(cents>0?50:-50):cents, msg, cls);
    } else if(now-lastSeen>1200){ smooth=null; }
    raf=requestAnimationFrame(micLoop);
  }

  // =====================================================================
  //  Chords (standard G C E A shapes)
  //  f: frets [string 4 G, 3 C, 2 E, 1 A]; fg: fingers, 0 = open
  // =====================================================================
  const CHORDS = {
    "C":   {f:[0,0,0,3], fg:[0,0,0,3], g:"major"},
    "F":   {f:[2,0,1,0], fg:[2,0,1,0], g:"major"},
    "G":   {f:[0,2,3,2], fg:[0,1,3,2], g:"major"},
    "D":   {f:[2,2,2,0], fg:[1,2,3,0], g:"major"},
    "A":   {f:[2,1,0,0], fg:[2,1,0,0], g:"major"},
    "Bb":  {f:[3,2,1,1], fg:[3,2,1,1], g:"major", barre:{fret:1,from:2,to:3}},
    "Am":  {f:[2,0,0,0], fg:[2,0,0,0], g:"minor"},
    "Dm":  {f:[2,2,1,0], fg:[2,3,1,0], g:"minor"},
    "Em":  {f:[0,4,3,2], fg:[0,3,2,1], g:"minor"},
    "Bm":  {f:[4,2,2,2], fg:[3,1,1,1], g:"minor", barre:{fret:2,from:1,to:3}},
    "G7":  {f:[0,2,1,2], fg:[0,2,1,3], g:"seventh"},
    "C7":  {f:[0,0,0,1], fg:[0,0,0,1], g:"seventh"},
    "D7":  {f:[2,2,2,3], fg:[1,1,1,2], g:"seventh", barre:{fret:2,from:0,to:2}},
    "E7":  {f:[1,2,0,2], fg:[1,2,0,3], g:"seventh"},
    "A7":  {f:[0,1,0,0], fg:[0,1,0,0], g:"seventh"},
    "Am7": {f:[0,0,0,0], fg:[0,0,0,0], g:"seventh"}
  };
  const EXTRA = { "Cm": {f:[0,3,3,3], fg:[0,1,2,3]} };   // only for the lesson comparison
  const CHORD_ORDER = Object.keys(CHORDS);
  const shown = n => n.replace("b","♭");
  const shape = n => CHORDS[n]||EXTRA[n];

  function chordMidis(name){
    const base = current==="lowg" ? TUNINGS.lowg : TUNINGS.std;
    return shape(name).f.map((fr,i)=>noteMidi(base[i])+fr);
  }
  function chordNotes(name){
    const root = NAMES.indexOf(name[0]) - (name[1]==="b"?1:0);
    const pcs=[...new Set(chordMidis(name).map(m=>m%12))];
    pcs.sort((a,b)=>((a-root+12)%12)-((b-root+12)%12));
    return pcs.map(p=>PC_LABEL[p]).join(" ");
  }
  function strum(name, when, gain, gap){
    const c=getCtx(), t0=when||c.currentTime;
    chordMidis(name).forEach((m,i)=>playFreq(midiFreq(m), t0+i*(gap??0.028), gain??0.32));
  }
  function strumSeq(names){
    stopAll(); const c=getCtx(), t0=c.currentTime;
    names.forEach((n,k)=>strum(n, t0+k*1.5));
  }

  function diagram(name){
    const ch=shape(name), W=100, H=128, xs=[20,40,60,80], top=26, step=20, frets=5;
    let s=`<svg class="dg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${shown(name)}">`;
    for(let k=1;k<=frets;k++) s+=`<line class="fret" x1="20" x2="80" y1="${top+k*step}" y2="${top+k*step}"/>`;
    xs.forEach(x=>s+=`<line class="str" x1="${x}" x2="${x}" y1="${top}" y2="${top+frets*step}"/>`);
    s+=`<line class="nut" x1="19" x2="81" y1="${top}" y2="${top}"/>`;
    if(ch.barre){ const b=ch.barre, y=top+(b.fret-.5)*step;
      s+=`<rect class="fd" x="${xs[b.from]-8}" y="${y-8}" width="${xs[b.to]-xs[b.from]+16}" height="16" rx="8"/>`; }
    ch.f.forEach((fr,i)=>{
      const x=xs[i];
      if(fr===0){ s+=`<circle class="op" cx="${x}" cy="${top-9}" r="4.5"/>`; return; }
      const y=top+(fr-.5)*step;
      s+=`<circle class="fd" cx="${x}" cy="${y}" r="8"/><text class="fn" x="${x}" y="${y}">${ch.fg[i]||""}</text>`;
    });
    ["G","C","E","A"].forEach((l,i)=>s+=`<text class="sl" x="${xs[i]}" y="${H-1}">${l}</text>`);
    return s+"</svg>";
  }

  // lesson buttons
  document.querySelectorAll("#lesson [data-play]").forEach(b=>b.onclick=()=>{ stopAll(); strum(b.dataset.play); });
  document.querySelectorAll("#lesson [data-seq]").forEach(b=>b.onclick=()=>strumSeq(b.dataset.seq.split(",")));
  $("lesson").open = store.get("lessonOpen", true);
  $("lesson").addEventListener("toggle", ()=>store.set("lessonOpen", $("lesson").open));

  function renderLibrary(){
    const lib=$("lib"); lib.innerHTML="";
    if(current==="d"||current==="bari"){
      const p=document.createElement("p"); p.className="note-box"; p.style.marginBottom="12px";
      p.textContent=t("altTuning",{t:t("chip_"+current)}); lib.appendChild(p);
    }
    ["major","minor","seventh"].forEach(gr=>{
      const lab=document.createElement("div"); lab.className="group-label "+gr;
      lab.innerHTML=`<b>${t("grp_"+gr)}</b><span>${t("grpd_"+gr)}</span>`;
      lib.appendChild(lab);
      const grid=document.createElement("div"); grid.className="chord-grid"; grid.style.margin="10px 0 16px";
      CHORD_ORDER.filter(n=>CHORDS[n].g===gr).forEach(n=>{
        const b=document.createElement("button"); b.type="button"; b.className="chord-card "+gr;
        b.innerHTML=`<b>${shown(n)}</b>${diagram(n)}<span class="notes">${chordNotes(n)}</span>`;
        b.onclick=()=>{ stopAll(); strum(n); b.classList.add("on"); setTimeout(()=>b.classList.remove("on"),700); };
        grid.appendChild(b);
      });
      lib.appendChild(grid);
    });
  }

  // =====================================================================
  //  Chord switching practice
  // =====================================================================
  const PRESETS = [
    {key:"preset_starter", seq:["C","Am"]},
    {label:"C–Am–F–G", seq:["C","Am","F","G"]},
    {label:"C–G–Am–F", seq:["C","G","Am","F"]},
    {label:"Am–F–C–G", seq:["Am","F","C","G"]},
    {label:"G–Em–C–D", seq:["G","Em","C","D"]},
    {label:"C–F–G7", seq:["C","F","G7"]},
    {key:"preset_blues", seq:["A7","D7","E7"]}
  ];
  let pracSeq = store.get("pracSeq", ["C","Am","F","G"]).filter(n=>CHORDS[n]);
  if(pracSeq.length<2) pracSeq=["C","Am","F","G"];
  let beatsPer = store.get("beatsPer", 4), order = store.get("order","seq"), demoStrum = store.get("demo", true);
  let bpm = store.get("bpm", 70);
  $("bpm").value=bpm; $("bpmVal").textContent=bpm;
  const sameSeq=(a,b)=>a.length===b.length&&a.every((x,i)=>x===b[i]);

  function renderPracticeControls(){
    const pr=$("presets"); pr.innerHTML="";
    PRESETS.forEach(p=>{
      const b=document.createElement("button"); b.type="button"; b.className="chip small";
      b.textContent=p.key? t(p.key) : p.label; b.setAttribute("aria-pressed", sameSeq(p.seq,pracSeq));
      b.onclick=()=>{ pracSeq=[...p.seq]; afterSeqChange(); };
      pr.appendChild(b);
    });
    const pk=$("pracPick"); pk.innerHTML="";
    CHORD_ORDER.forEach(n=>{
      const b=document.createElement("button"); b.type="button"; b.className="chip small";
      b.textContent=shown(n); b.setAttribute("aria-pressed", pracSeq.includes(n));
      b.onclick=()=>{
        if(pracSeq.includes(n)){ if(pracSeq.length<=2) return; pracSeq=pracSeq.filter(x=>x!==n); }
        else pracSeq.push(n);
        afterSeqChange();
      };
      pk.appendChild(b);
    });
    document.querySelectorAll("#beatsPer .chip").forEach(b=>{ b.textContent=t("beatsN",{n:b.dataset.n}); b.setAttribute("aria-pressed", +b.dataset.n===beatsPer); });
    document.querySelectorAll("#orderPick .chip").forEach(b=>b.setAttribute("aria-pressed", b.dataset.o===order));
    $("strumBtn").setAttribute("aria-pressed",demoStrum); $("strumBtn").textContent=demoStrum?t("demoOn"):t("demoOff");
    $("pracBtn").textContent = running? t("stop") : t("start");
    const best=store.get("best:"+pracSeq.join("-"),null);
    $("stBest").textContent = best? best+" BPM" : "–";
  }
  function afterSeqChange(){ store.set("pracSeq",pracSeq); if(running) stopPractice(); idx=0; nextIdx=pickNext(0); renderPracticeControls(); renderPracticeStage(); }
  document.querySelectorAll("#beatsPer .chip").forEach(b=>b.onclick=()=>{ beatsPer=+b.dataset.n; store.set("beatsPer",beatsPer); renderPracticeControls(); renderBeats(-1); });
  document.querySelectorAll("#orderPick .chip").forEach(b=>b.onclick=()=>{ order=b.dataset.o; store.set("order",order); nextIdx=pickNext(idx); renderPracticeControls(); renderPracticeStage(); });
  $("strumBtn").onclick=()=>{ demoStrum=!demoStrum; store.set("demo",demoStrum); renderPracticeControls(); };
  $("bpm").oninput=e=>{ bpm=+e.target.value; $("bpmVal").textContent=bpm; store.set("bpm",bpm); fullMinuteAt=null; };

  let idx=0, nextIdx=1;
  function pickNext(i){
    if(order==="seq") return (i+1)%pracSeq.length;
    let j; do{ j=Math.floor(Math.random()*pracSeq.length); } while(j===i && pracSeq.length>1); return j;
  }
  function renderPracticeStage(){
    if(idx>=pracSeq.length) idx=0; if(nextIdx>=pracSeq.length||nextIdx===idx&&pracSeq.length>1) nextIdx=pickNext(idx);
    const a=pracSeq[idx], b=pracSeq[nextIdx];
    $("nowName").textContent=shown(a); $("nowDg").innerHTML=diagram(a);
    $("nextName").textContent=shown(b); $("nextDg").innerHTML=diagram(b);
  }
  function renderBeats(on){
    const bx=$("beats"); bx.innerHTML="";
    for(let i=0;i<beatsPer;i++){ const d=document.createElement("span"); d.className="beat"+(i===on?" on":"")+(i===0&&on===0?" first":""); bx.appendChild(d); }
  }

  let running=false, timer=null, nextTime=0, beatNo=0, changes=0, startedAt=0, clockTimer=null, wakeLock=null, fullMinuteAt=null;
  const queue=[];
  function click(time, accent){
    const c=getCtx(), o=c.createOscillator(), g=c.createGain();
    o.frequency.value=accent?1600:1050; g.gain.setValueAtTime(0.0001,time);
    g.gain.exponentialRampToValueAtTime(accent?0.5:0.3,time+0.002); g.gain.exponentialRampToValueAtTime(0.0001,time+0.05);
    o.connect(g).connect(c.destination); o.start(time); o.stop(time+0.06);
  }
  function schedule(){
    const c=getCtx();
    while(nextTime < c.currentTime+0.12){
      const b=beatNo%beatsPer;
      if(b===0 && beatNo>0){ idx=nextIdx; nextIdx=pickNext(idx); }
      click(nextTime, b===0);
      if(b===0 && demoStrum) strum(pracSeq[idx], nextTime, 0.22, 0.02);
      queue.push({t:nextTime, b, chord:idx, next:nextIdx, change:(b===0&&beatNo>0)});
      nextTime += 60/bpm; beatNo++;
    }
  }
  function drawLoop(){
    if(!running) return;
    const now=getCtx().currentTime;
    while(queue.length && queue[0].t<=now){
      const q=queue.shift();
      if(q.b===0){
        const a=pracSeq[q.chord], b=pracSeq[q.next];
        $("nowName").textContent=shown(a); $("nowDg").innerHTML=diagram(a);
        $("nextName").textContent=shown(b); $("nextDg").innerHTML=diagram(b);
        if(q.change){ changes++; $("stChanges").textContent=changes; }
      }
      renderBeats(q.b);
    }
    requestAnimationFrame(drawLoop);
  }
  function startPractice(){
    const c=getCtx(); running=true; beatNo=0; changes=0; queue.length=0;
    nextIdx=pickNext(idx);
    nextTime=c.currentTime+0.15; startedAt=performance.now(); fullMinuteAt=startedAt+60000;
    $("stChanges").textContent="0"; $("stTime").textContent="0:00";
    $("pracBtn").textContent=t("stop"); $("pracBtn").classList.remove("primary");
    timer=setInterval(schedule,25); schedule(); requestAnimationFrame(drawLoop);
    clockTimer=setInterval(()=>{
      const s=Math.floor((performance.now()-startedAt)/1000);
      $("stTime").textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
      if(fullMinuteAt && performance.now()>=fullMinuteAt){
        const key="best:"+pracSeq.join("-"), best=store.get(key,0);
        if(bpm>best){ store.set(key,bpm); $("stBest").textContent=bpm+" BPM"; }
        fullMinuteAt=null;
      }
    },250);
    if(navigator.wakeLock) navigator.wakeLock.request("screen").then(w=>wakeLock=w).catch(()=>{});
  }
  function stopPractice(){
    running=false; clearInterval(timer); clearInterval(clockTimer); queue.length=0; stopAll();
    $("pracBtn").textContent=t("start"); $("pracBtn").classList.add("primary"); renderBeats(-1);
    if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock=null; }
  }
  $("pracBtn").onclick=()=> running? stopPractice() : startPractice();

  // =====================================================================
  //  Ear training
  // =====================================================================
  const LEVELS = [
    {id:"l1", pool:["C","F","G","Am"]},
    {id:"l2", pool:["C","F","G","Am","Dm","Em"]},
    {id:"l3", pool:["C","F","G","Am","Dm","Em","G7","C7"]},
    {id:"l4", pool:CHORD_ORDER}
  ];
  let level = store.get("level","l1"); if(!LEVELS.find(l=>l.id===level)) level="l1";
  let qTarget=null, qAnswered=false, qRight=0, qTotal=0, qStreak=0, qBest=store.get("qBest",0), fbKey="quizIdle";
  $("qBest").textContent=qBest;
  const pool = () => LEVELS.find(l=>l.id===level).pool;
  function renderLevels(){
    const lv=$("levels"); lv.innerHTML="";
    LEVELS.forEach(l=>{
      const b=document.createElement("button"); b.type="button"; b.className="chip small";
      b.textContent=t("lvl_"+l.id); b.setAttribute("aria-pressed", l.id===level);
      b.onclick=()=>{ level=l.id; store.set("level",level); qTarget=null; renderLevels(); renderAnswers(); resetQuestion(); };
      lv.appendChild(b);
    });
  }
  function renderAnswers(){
    const box=$("answers"); box.innerHTML="";
    pool().forEach(n=>{
      const b=document.createElement("button"); b.type="button"; b.className="ans"; b.dataset.c=n; b.textContent=shown(n);
      b.onclick=()=>answer(n,b); box.appendChild(b);
    });
  }
  function setFb(key, cls, vars){ fbKey=key; fbVars=vars; const f=$("quizFb"); f.textContent=t(key,vars); f.className="feedback "+(cls||""); }
  let fbVars=null;
  function resetQuestion(){
    qAnswered=false; $("quizNext").disabled=true; $("quizReveal").innerHTML="";
    setFb("quizIdle");
    document.querySelectorAll(".ans").forEach(a=>a.classList.remove("right","wrong"));
  }
  function newQuestion(){
    const p=pool(); let n; do{ n=p[Math.floor(Math.random()*p.length)]; } while(n===qTarget && p.length>1);
    qTarget=n; resetQuestion(); setFb("quizAsk");
    stopAll(); strum(qTarget);
  }
  $("quizPlay").onclick=()=>{ if(!qTarget){ newQuestion(); return; } stopAll(); strum(qTarget); };
  $("quizArp").onclick=()=>{ if(!qTarget) newQuestion(); else { stopAll(); strum(qTarget, 0, 0.4, 0.38); } };
  $("quizNext").onclick=newQuestion;
  function answer(n,btn){
    if(!qTarget || qAnswered){ stopAll(); strum(n); return; }
    qAnswered=true; qTotal++;
    const ok = n===qTarget;
    document.querySelector(`.ans[data-c="${qTarget}"]`).classList.add("right");
    if(ok){ qRight++; qStreak++; setFb("quizRight","good"); }
    else { btn.classList.add("wrong"); qStreak=0; setFb("quizWrong","bad",{c:shown(qTarget)}); }
    if(qStreak>qBest){ qBest=qStreak; store.set("qBest",qBest); }
    $("qScore").textContent=qRight+"/"+qTotal; $("qStreak").textContent=qStreak; $("qBest").textContent=qBest;
    $("quizReveal").innerHTML=diagram(qTarget);
    $("quizNext").disabled=false;
    if(ok){ const q=qTarget; setTimeout(()=>{ if(qAnswered && qTarget===q && activeTab==="quiz") newQuestion(); }, 1400); }
  }

  // =====================================================================
  //  Language
  // =====================================================================
  function applyLang(){
    document.documentElement.lang = lang==="zh" ? "zh-CN" : "en";
    document.title = lang==="zh" ? "尤克里里练习" : "Ukulele Practice";
    $("lang-zh").setAttribute("aria-pressed", lang==="zh"); $("lang-en").setAttribute("aria-pressed", lang==="en");
    document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));
    renderTuner(); renderLibrary(); renderPracticeControls(); renderLevels();
    if(!micOn && !$("status").textContent.trim() || $("status").dataset.idle!=="0") { setStatus(t("tuneIdle")); $("status").dataset.idle="1"; }
    setFb(fbKey, $("quizFb").className.replace("feedback","").trim(), fbVars);
  }
  document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{ lang=b.dataset.lang; store.set("lang",lang); applyLang(); });
  // once the user interacts with the tuner, stop overwriting its status on language change
  ["micBtn","head"].forEach(id=>$(id).addEventListener("click",()=>{ $("status").dataset.idle="0"; }, true));

  // ---------- init ----------
  applyLang(); renderPracticeStage(); renderBeats(-1); renderAnswers(); setNeedle(0);
  showTab(store.get("tab","tune"));
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
